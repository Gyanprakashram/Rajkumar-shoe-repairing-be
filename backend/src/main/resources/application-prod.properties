server.port=${PORT:8080}

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

app.jwt-secret=${JWT_SECRET}
app.frontend-url=${FRONTEND_URL}
app.auth.otp-required=${OTP_REQUIRED:true}
app.auth.otp-debug=false
app.admin-phone=${ADMIN_PHONE}
app.admin-password=${ADMIN_PASSWORD}
app.cors-origin=${CORS_ORIGIN}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
app.notifications.email-from=${SMTP_FROM:${spring.mail.username}}
app.notifications.email-to=${ORDER_NOTIFICATION_EMAIL:}
app.notifications.admin-phone=${ADMIN_PHONE}

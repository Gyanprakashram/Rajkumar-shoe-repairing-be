spring.profiles.default=local
spring.application.name=rajkumar-cobbler-platform

server.error.include-message=never
server.ssl.enabled=${HTTPS_ENABLED:false}
server.ssl.key-store=${HTTPS_KEYSTORE:}
server.ssl.key-store-password=${HTTPS_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${HTTPS_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${HTTPS_KEY_ALIAS:}

logging.level.com.rajkumar.shoe=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-none}] %logger{36} - %msg%n

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

app.jwt-expiration-ms=${JWT_EXPIRATION_MS:900000}
app.session-idle-timeout-ms=${SESSION_IDLE_TIMEOUT_MS:300000}
app.auth.otp-length=${OTP_LENGTH:6}
app.auth.otp-ttl-minutes=${OTP_TTL_MINUTES:5}
app.auth.otp-max-attempts=${OTP_MAX_ATTEMPTS:5}
app.auth.otp-lock-minutes=${OTP_LOCK_MINUTES:15}
app.shop.name=${APP_SHOP_NAME:Raj Kumar Shoe Repairing}
app.shop.address=${APP_SHOP_ADDRESS:Bistupur, Jamshedpur, Jharkhand}
app.api-encryption.enabled=${API_ENCRYPTION_ENABLED:false}
app.api-encryption.key=${API_ENCRYPTION_KEY:}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=rajkumar-workshop-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.common.serialization.JsonDeserializer

app.gemini.api-key=${GEMINI_API_KEY:}
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:5000}

app.notifications.whatsapp-token=${WHATSAPP_ACCESS_TOKEN:}
app.notifications.whatsapp-phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.notifications.whatsapp-api-version=${WHATSAPP_API_VERSION:v22.0}
app.notifications.whatsapp-template=${WHATSAPP_TEMPLATE:order_update}
app.notifications.whatsapp-language=${WHATSAPP_LANGUAGE:en}
app.notifications.whatsapp-country-code=${WHATSAPP_COUNTRY_CODE:91}
app.notifications.sms-account-sid=${TWILIO_ACCOUNT_SID:}
app.notifications.sms-auth-token=${TWILIO_AUTH_TOKEN:}
app.notifications.sms-from=${TWILIO_FROM_NUMBER:}
